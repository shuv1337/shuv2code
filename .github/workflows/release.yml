name: Prepare or publish shuv2code release

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Prepare artifacts or perform external publication"
        required: true
        default: prepare
        type: choice
        options: [prepare, publish]
      channel:
        description: "npm and release channel"
        required: true
        default: latest
        type: choice
        options: [latest, nightly]
      version:
        description: "Exact semver (initial release: 0.1.0-alpha.1)"
        required: true
        default: 0.1.0-alpha.1
        type: string
      ios_sqim_release_confirmed:
        description: "Confirm the matching iOS build was released through Sqim before desktop publication"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: shuv2code-release-${{ inputs.version }}-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate release request
        shell: bash
        run: |
          set -euo pipefail
          version="${{ inputs.version }}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $version" >&2
            exit 1
          fi
          if [[ "${{ inputs.mode }}" == "publish" && "${{ inputs.ios_sqim_release_confirmed }}" != "true" ]]; then
            echo "Publishing is blocked until the matching iOS Sqim release is confirmed." >&2
            exit 1
          fi
          node scripts/update-release-package-versions.ts "$version"
          test "$(node -p "require('./apps/server/package.json').version")" = "$version"

      - name: Validate identity and generated inputs
        run: |
          vp run brand:check
          vp run schema:check
          vp run icons:check

      - name: Full CI verification
        run: |
          vp check
          vp run typecheck
          vp run test

      - name: Validate mobile release configurations
        run: |
          APP_VARIANT=production vp run --filter @shuv2code/mobile config:prod
          APP_VARIANT=preview vp run --filter @shuv2code/mobile config:preview

  npm_server:
    name: Build and optionally publish exact npm server
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Align exact release version
        run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"

      - name: Build and pack server
        run: |
          vp run --filter shuv2code build:bundle
          mkdir -p release-server
          pnpm --filter shuv2code pack --pack-destination "$GITHUB_WORKSPACE/release-server"

      - uses: actions/upload-artifact@v7
        with:
          name: shuv2code-npm-${{ inputs.version }}
          path: release-server/*.tgz
          if-no-files-found: error

      - name: Publish server before clients
        if: inputs.mode == 'publish'
        run: pnpm --filter shuv2code publish --no-git-checks --tag "${{ inputs.channel }}" --provenance

  linux:
    name: Linux x64 AppImage
    needs: npm_server
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"
      - name: Build AppImage
        run: vp run dist:desktop:artifact --platform linux --target AppImage --arch x64 --build-version "${{ inputs.version }}"
      - name: Collect artifact
        run: |
          mkdir -p release-linux
          find release -maxdepth 1 -type f -name '*.AppImage*' -exec cp {} release-linux/ \;
          test -n "$(find release-linux -type f -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: shuv2code-linux-x64-${{ inputs.version }}
          path: release-linux/*
          if-no-files-found: error

  macos_arm64:
    name: Signed Apple silicon DMG and ZIP
    needs: npm_server
    runs-on: macos-15
    timeout-minutes: 40
    env:
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      SHUV2CODE_APPLE_TEAM_ID: ${{ vars.SHUV2CODE_APPLE_TEAM_ID }}
      MACOS_PROVISIONING_PROFILE: ${{ secrets.MACOS_PROVISIONING_PROFILE }}
      SHUV2CODE_CLERK_PASSKEY_RP_DOMAINS: ${{ vars.SHUV2CODE_CLERK_PASSKEY_RP_DOMAINS }}
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true
      - run: node scripts/update-release-package-versions.ts "${{ inputs.version }}"
      - name: Require signing inputs for publication
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER SHUV2CODE_APPLE_TEAM_ID MACOS_PROVISIONING_PROFILE; do
            test -n "${!name:-}" || { echo "Missing required macOS publication input: $name" >&2; exit 1; }
          done
      - name: Prepare signing inputs
        if: inputs.mode == 'publish'
        shell: bash
        run: |
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" > "$key_path"
          echo "APPLE_API_KEY=$key_path" >> "$GITHUB_ENV"
          profile_path="$RUNNER_TEMP/shuv2code.provisionprofile"
          printf '%s' "$MACOS_PROVISIONING_PROFILE" | base64 -D > "$profile_path"
          security cms -D -i "$profile_path" >/dev/null
          echo "SHUV2CODE_MACOS_PROVISIONING_PROFILE=$profile_path" >> "$GITHUB_ENV"
      - name: Build DMG and ZIP
        shell: bash
        run: |
          args=(--platform mac --target dmg --arch arm64 --build-version "${{ inputs.version }}")
          if [[ "${{ inputs.mode }}" == "publish" ]]; then args+=(--signed); fi
          vp run dist:desktop:artifact "${args[@]}"
      - name: Collect artifacts
        run: |
          mkdir -p release-macos
          find release -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.yml' \) -exec cp {} release-macos/ \;
          test -n "$(find release-macos -type f -print -quit)"
      - uses: actions/upload-artifact@v7
        with:
          name: shuv2code-macos-arm64-${{ inputs.version }}
          path: release-macos/*
          if-no-files-found: error

  github_release:
    name: Publish GitHub prerelease after npm, iOS, Linux, and macOS
    if: inputs.mode == 'publish'
    needs: [npm_server, linux, macos_arm64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: shuv2code-*-${{ inputs.version }}
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: shuv2code v${{ inputs.version }}
          generate_release_notes: true
          prerelease: true
          make_latest: false
          files: |
            release-assets/*.AppImage
            release-assets/*.dmg
            release-assets/*.zip
            release-assets/*.yml
          fail_on_unmatched_files: true
