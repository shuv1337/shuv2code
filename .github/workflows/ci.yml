name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Personal-project gate: one fast self-hosted job.
# Full monorepo tests, typecheck, desktop builds, Rust, and mobile native lint
# run on the manual release workflow's verify job, not every PR.
jobs:
  ci:
    name: CI
    runs-on: [self-hosted, Linux, X64, shuv-ci, shuv2code-ci]
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate brand identity inputs
        run: |
          vp run brand:check
          vp run schema:check
          vp run icons:check

      - name: Lint
        run: vp check
