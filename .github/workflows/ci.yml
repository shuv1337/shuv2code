name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Personal-project gate on GitHub-hosted ubuntu-latest: brand/schema/icons +
# vp check. Deeper verification lives on the manual release workflow's verify
# job: typecheck, full unit/integration tests, release-smoke, and
# resource-monitor cargo fmt/test. Desktop package builds, mobile native lint,
# and signed macOS builds still run only on the release pack/platform jobs,
# not on every PR.

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Do not set persist-credentials: false. Checkout then runs
      # `git submodule foreach`, which exits 128 on the vendored gitlink
      # .repos/alchemy-effect/.vendor/alchemy. This job does not push;
      # contents: read is what keeps the token from writing.
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@250f29ce396baf5e8f24498e17c0dfdebabc26eb # v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate brand identity inputs
        run: |
          vp run brand:check
          vp run schema:check
          vp run icons:check

      - name: Lint
        # Job stdout is non-blocking. vp check can panic on EAGAIN (os error 11)
        # while printing diagnostics and still exit 0. The runner spools that
        # output to a file and fails when the panic text is present.
        run: node scripts/run-vp-check.ts
