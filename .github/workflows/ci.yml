name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Personal-project gate: one self-hosted job focused on fast feedback.
# Full monorepo typecheck, desktop builds, Rust, mobile native lint, and the
# whole test matrix stay on the manual release workflow's verify job.
jobs:
  ci:
    name: CI
    runs-on: [self-hosted, Linux, X64, shuv-ci, shuv2code-ci]
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate brand identity inputs
        run: |
          vp run brand:check
          vp run schema:check
          vp run icons:check

      - name: Lint
        run: vp check

      # Keep a unit-test signal on PRs, but do not expand into desktop/Rust/native.
      - name: Test
        run: vp run test
