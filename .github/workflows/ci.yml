name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Personal-project gate: one self-hosted job, no desktop build, no macOS native
# lint, no Rust toolchain, no release smoke. Heavy verification stays on the
# manual release workflow's verify job.
jobs:
  ci:
    name: CI
    runs-on: [self-hosted, Linux, X64, shuv-ci, shuv2code-ci]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: true

      - name: Validate brand identity inputs
        run: |
          vp run brand:check
          vp run schema:check
          vp run icons:check

      - name: Lint
        run: vp check

      - name: Test
        run: vp run test
